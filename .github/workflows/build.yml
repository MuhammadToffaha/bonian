name: 📦 Build & Release APK

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: 🧪 Logic tests
        run: node tests/logic.test.js

      - name: 🔐 Admin lock UI test
        run: |
          npm i --no-save --silent playwright@1
          npx playwright install --with-deps chromium > /dev/null
          node tests/admin-lock.test.js

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build signed APK
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          set -o pipefail
          ./gradlew assembleRelease --no-daemon 2>&1 | tee build.log || {
            { grep -E "^e: |error:|ERROR:" build.log | grep -v "^> Task" | head -8
              grep -A4 "What went wrong" build.log | head -5; } | while IFS= read -r l; do echo "::error::${l:0:900}"; done
            exit 1
          }
          cp app/build/outputs/apk/release/app-release.apk bonian.apk

      - name: Publish GitHub Release (the app updates itself from here)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: بُنيان 1.0.${{ github.run_number }}
          body: |
            ${{ github.event.head_commit.message || 'Manual build' }}

            Designed by Muhammad Toffaha
          files: bonian.apk
          make_latest: true
